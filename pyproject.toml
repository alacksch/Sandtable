[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-mujoco"
version = "0.1.0"
description = "SO-101 MuJoCo setup and inspection tools"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "viser",
    "numpy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

