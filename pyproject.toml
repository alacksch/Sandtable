[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-mujoco"
version = "0.1.0"
description = "SO-101 MuJoCo setup and inspection tools"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "viser",
    "numpy",
    "pytest",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pillow",
]

[project.optional-dependencies]
smolvla = ["lerobot[smolvla]==0.6.1; python_version >= '3.12'"]

[tool.setuptools.packages.find]
where = ["src"]

